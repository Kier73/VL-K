name: Conventional Linux substrate qualification
on:
  workflow_dispatch:
  push:
    paths:
      - 'compat/unkernel/**'
      - '.gitmodules'
      - 'vendor/unkernel'
      - '.github/workflows/conventional-linux.yml'
  pull_request:
    paths:
      - 'compat/unkernel/**'
      - '.gitmodules'
      - 'vendor/unkernel'
      - '.github/workflows/conventional-linux.yml'
permissions:
  contents: read
jobs:
  linux-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify upstream source checkout
        run: |
          git submodule update --init --depth 1 vendor/unkernel
          test "$(git -C vendor/unkernel rev-parse HEAD)" = fd204d3130309c45ce51795c753c3b8ec1eaddfd
      - name: Structural disk oracle
        run: node compat/unkernel/disk-test.mjs
      - name: Verify and extract pinned upstream release
        run: bash compat/unkernel/prepare.sh
      - name: Run actual Linux guest acceptance
        run: |
          timeout 300 node compat/unkernel/smoke.mjs alpine
          timeout 300 node compat/unkernel/smoke.mjs debian
