name: Conventional Linux substrate qualification
on:
  workflow_dispatch:
  push:
    paths:
      - 'compat/unkernel/**'
      - '.gitmodules'
      - 'vendor/unkernel'
      - '.github/workflows/conventional-linux.yml'
  pull_request:
    paths:
      - 'compat/unkernel/**'
      - '.gitmodules'
      - 'vendor/unkernel'
      - '.github/workflows/conventional-linux.yml'
permissions:
  contents: read
jobs:
  linux-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify upstream source checkout
        run: |
          git submodule update --init --depth 1 vendor/unkernel
          test "$(git -C vendor/unkernel rev-parse HEAD)" = fd204d3130309c45ce51795c753c3b8ec1eaddfd
      - name: Structural disk oracle
        run: |
          node compat/unkernel/disk-test.mjs
          node compat/unkernel/ground-test.mjs
          python3 compat/unkernel/ground_history_test.py
          node compat/unkernel/history-device-test.mjs
          node compat/unkernel/coordinate-witness-test.mjs
          python3 compat/unkernel/remote-observer-test.py
          node compat/unkernel/observation-device-test.mjs
      - name: Verify and extract pinned upstream release
        run: bash compat/unkernel/prepare.sh
      - name: Run actual Linux guest acceptance
        run: |
          timeout 300 node compat/unkernel/smoke.mjs alpine
          timeout 300 node compat/unkernel/smoke.mjs debian

      - name: Durable Ground through Linux ext4
        run: |
          command -v mke2fs || (sudo apt-get update && sudo apt-get install -y e2fsprogs)
          truncate -s 16M /tmp/vlk-ext4.img
          mke2fs -q -t ext4 -F /tmp/vlk-ext4.img
          timeout 600 node compat/unkernel/ground-linux.mjs /tmp/vlk-ext4.img /tmp/vlk-ext4.ground

      - name: Historical coordinate Ground through Linux ext4
        run: timeout 600 node compat/unkernel/history-linux.mjs /tmp/vlk-ext4.img /tmp/vlk-history.sqlite

  native-observation-pathway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 09a9058a43c139c476609954636e17e7fadcfd37
          path: .deps/ecpu
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native E-CPU authenticated coordinate pathway
        env:
          PYTHONPATH: ${{ github.workspace }}/.deps/ecpu
          VLK_NATIVE_ECPU: '1'
        run: timeout 180 python3 compat/unkernel/remote-observer-test.py
