name: Kernel validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld make gcc python3
      - name: Build and validate
        run: make test
      - name: Record WASM size
        run: wc -c dist/vlk.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: vlk-wasm
          path: dist/vlk.wasm
