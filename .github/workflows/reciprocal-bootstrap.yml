name: Reciprocal VL-K and E-CPU bootstrap
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kier73/E-CPU
          ref: 09a9058a43c139c476609954636e17e7fadcfd37
          path: _ecpu
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build VL-K and install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make gcc
          python -m pip install pytest numpy
          make all
      - name: Execute pinned E-CPU RRNS utility against VL-K
        run: ./dist/vlk run python tests/ecpu_rrns.py _ecpu
      - name: Cross-check weighted Ground time coordinates using E-CPU RRNS
        run: ./dist/vlk run python tests/weighted_ground.py _ecpu
      - name: Cross-check sparse temporal refinement using E-CPU RRNS
        run: ./dist/vlk run python tests/refine.py _ecpu
      - name: E-CPU's own research tests under the VL-K command surface
        working-directory: _ecpu
        run: ../dist/vlk run python -m pytest -q tests/test_affine_orbit.py tests/test_recurrence_observer.py tests/test_transit_compute.py
      - name: E-CPU carries VL-K observations
        env:
          PYTHONPATH: ${{ github.workspace }}/_ecpu
        run: ./dist/vlk run python tests/ecpu_observation.py
